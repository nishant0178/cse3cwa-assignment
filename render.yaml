services:
  - type: web
    name: cse3cwa-escape-room
    runtime: docker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: /api/scores
      - key: DATABASE_URL
        fromDatabase:
          name: cse3cwa-db
          property: connectionString

databases:
  - name: cse3cwa-db
    plan: free
    databaseName: escaperoom_db
    user: escaperoom_user
